; ESP32 MP3 player — see include/Config.h for pins and tunables.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 3 MB app partition: room for the Japanese font compiled into flash (no OTA/SPIFFS used).
board_build.partitions = huge_app.csv

lib_deps =
	esphome/ESP32-audioI2S@2.3.0
	bodmer/TFT_eSPI@2.5.43

build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS

; ---- TFT_eSPI config (optional) ----
; Right now the panel config lives in .pio/libdeps/.../TFT_eSPI/User_Setup.h, which is
; NOT in git and is wiped by a clean install. To pin it to the repo, copy the values from that
; file here, uncomment, and append to build_flags above:
;	-DUSER_SETUP_LOADED=1
;	-DST7789_DRIVER=1
;	-DTFT_WIDTH=240
;	-DTFT_HEIGHT=320
;	-DTFT_MISO=19
;	-DTFT_MOSI=23
;	-DTFT_SCLK=18
;	-DTFT_CS=15
;	-DTFT_DC=2
;	-DTFT_RST=-1
;	-DTFT_BL=<your BL pin>
;	-DTFT_BACKLIGHT_ON=HIGH
;	-DLOAD_GLCD=1
;	-DSMOOTH_FONT=1
;	-DSPI_FREQUENCY=40000000
;	(+ TFT_RGB_ORDER / TFT_INVERSION_ON if your User_Setup.h has them)
